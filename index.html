 try{await api('POST','settings?on_conflict=key',{key:'main',value:s},{Prefer:'resolution=merge-duplicates'});toast('تم حفظ الإعدادات ✓')}catch(e){toast(e.message,1)}}
/* ---------- custom notifications ---------- */
function notifs(){$('#main').innerHTML=head('الإشعارات المخصصة','رسائل بتظهر بقائمة إشعارات التطبيق وبتنبيه عند الفتح',`<button class="btn gold" onclick="editAnn()">${ic('plus')}إشعار جديد</button>`)+`<div class="card">${S.ann.map(a=>`<div class="row"><div class="gr"><b>${esc(a.title)}</b>${a.visible?'':' <span class="b">مخفي</span>'}<br><small style="color:var(--mist)">${esc(a.body)}</small><br><small style="color:var(--mist)">${new Date(a.created_at).toLocaleString('ar')}</small></div><button class="btn sm" onclick="editAnn('${a.id}')">${ic('edit')}تعديل</button><button class="btn sm ic red" onclick="delAnn('${a.id}')">${ic('trash')}</button></div>`).join('')||'<div class="empty">لا إشعارات بعد</div>'}</div>`}
function editAnn(id){const a=id?{...S.ann.find(x=>x.id==id)}:{title:'',body:'',link:'',visible:true};E=a;
 $('#mb').innerHTML=`<div class="mh"><h2>${id?'تعديل الإشعار':'إشعار جديد'}</h2><button class="btn ic" onclick="closeM()">✕</button></div><label class="f"><span>العنوان *</span><input id="at" value="${esc(a.title)}"></label><label class="f"><span>النص</span><textarea id="ab" style="min-height:90px">${esc(a.body)}</textarea></label><label class="f"><span>رابط عند الضغط (اختياري)</span><input id="al" value="${esc(a.link)}" placeholder="https://..."></label><label class="sw" style="margin-bottom:12px"><input type="checkbox" id="av2" ${a.visible?'checked':''}>ظاهر</label>${id?'':'<label class="sw" style="margin-bottom:12px"><input type="checkbox" id="ap" checked>أرسل أيضاً كإشعار على موبايلات المستخدمين</label>'}<div style="text-align:left"><button class="btn gold" onclick="saveAnn()">${id?'حفظ':'إرسال'}</button></div>`;$('#modal').classList.add('show')}
async function sendPush(title,body,url){
 const go=()=>fetch(URL_+'/functions/v1/send-push',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify({title,body,url:url||null})});
 let r=await go();if(r.status==401&&await refresh())r=await go();
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('خطأ '+r.status));return j}
async function saveAnn(){const a=E,r={title:$('#at').value.trim(),body:$('#ab').value.trim(),link:$('#al').value.trim()||null,visible:$('#av2').checked};if(!r.title)return toast('اكتب العنوان',1);
 const doPush=!a.id&&r.visible&&!!($('#ap')&&$('#ap').checked);
 try{a.id?await api('PATCH','announcements?id=eq.'+a.id,r):await api('POST','announcements',r);await load();closeM();toast('تم ✓');notifs();if(doPush){try{await sendPush(r.title,r.body,r.link);toast('تم الحفظ وإرسال الإشعار للموبايلات ✓')}catch(pe){toast('انحفظ، لكن فشل إرسال إشعار الموبايل: '+pe.message,1)}}}catch(e){toast(e.message.includes('announcements')?'شغّل ملف 4-notifications.sql أولاً':e.message,1)}}
async function delAnn(id){if(!confirm('حذف الإشعار؟'))return;try{await api('DELETE','announcements?id=eq.'+id);await load();notifs()}catch(e){toast(e.message,1)}}

function tools(){$('#main').innerHTML=head('أدوات','استيراد البيانات الحالية ونسخة احتياطية')+
 `<div class="grid two"><div class="card"><h3>${ic('up2')} استيراد بيانات التطبيق الحالي</h3><p style="color:var(--mist)">اختر ملف التطبيق القديم (بصمتك-تطبيق-2-4-1.html). رح تنرفع كل الصور لـ Supabase بعد ضغطها، وتنضاف كل المناطق والعقارات والفيديوهات. شغّلها مرة وحدة فقط.</p>
 <label class="btn gold">اختيار الملف وبدء الاستيراد<input type="file" accept=".html" hidden onchange="doImport(this)"></label><div class="prog"><i id="pg"></i></div><div class="log" id="lg"></div></div>
 <div class="card"><h3>${ic('dl')} نسخة احتياطية</h3><p style="color:var(--mist)">تنزيل كل العقارات والمناطق والإعدادات كملف JSON (الصور محفوظة بالتخزين).</p><button class="btn" onclick="backup()">تنزيل النسخة</button></div></div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({areas:S.areas,properties:S.props,settings:S.set},null,1)],{type:'application/json'}));a.download='basmatak-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function parseOld(txt){const m=txt.match(/<script id="roomData"[^>]*>([\s\S]*?)<\/script>/);if(!m)throw new Error('ما لقيت الصور بالملف');const imgs=JSON.parse(m[1]);
 const a=txt.indexOf('const CATEGORIES'),b=txt.indexOf('/* ترتيب الصور');if(a<0||b<0)throw new Error('ملف غير مدعوم');
 const js=txt.slice(a,b)+'\nreturn CATEGORIES;';return{imgs,cats:new Function(js)()}}
async function doImport(inp){const f=inp.files[0];if(!f)return;const lg=$('#lg'),log=t=>{lg.textContent+=t+'\n';lg.scrollTop=1e9};
 try{log('قراءة الملف…');const{imgs,cats}=parseOld(await f.text());const cache={};let total=new Set(),done=0;
 cats.forEach(c=>{if(c.cover)total.add(c.cover);c.properties.forEach(p=>{total.add(p.cover);(p.rooms||[]).forEach(r=>total.add(r.img));(p.tours||[]).forEach(t=>t.rooms.forEach(r=>total.add(r.img)))})});
 total=[...total].filter(k=>k&&k!='ph'&&imgs[k]);log('عدد الصور: '+total.length);
 const q=[...total],work=async()=>{while(q.length){const k=q.shift();try{const bl=await (await fetch(imgs[k])).blob();cache[k]=await upload(await compress(bl),'import')}catch(e){log('فشل '+k+': '+e.message)}$('#pg').style.width=(++done/total.length*90)+'%'}};
 await Promise.all([work(),work(),work(),work()]);const U=k=>cache[k]||null;log('حفظ المناطق والعقارات…');let n=0;
 for(const[ci,c]of cats.entries()){await api('POST','areas?on_conflict=id',{id:c.id,name:c.name,cover_url:U(c.cover),sort_order:ci},{Prefer:'resolution=merge-duplicates'});
  for(const[pi,p]of c.properties.entries()){const tours=(p.tours||[{label:'صور الشقة',rooms:p.rooms||[]}]);
   await api('POST','properties?on_conflict=id',{id:p.id,area_id:c.id,name:p.name,subtitle:p.subtitle,description:p.description,cover_url:U(p.cover),fit:p.fit||'contain',sold:!!p.sold,visible:true,listing_type:'sale',videos:p.videos||(p.video?[p.video]:[]),video_label:p.videoLabel||null,extra_video:p.extraVideo||null,added:p.added||null,sort_order:pi},{Prefer:'resolution=merge-duplicates'});
   await api('DELETE','tours?property_id=eq.'+p.id);const T=tours.map((t,i)=>({id:crypto.randomUUID(),property_id:p.id,label:t.label,sort_order:i}));await api('POST','tours',T);
   const R=[];tours.forEach((t,i)=>t.rooms.forEach((r,j)=>{if(U(r.img))R.push({tour_id:T[i].id,name:r.name,tag:r.tag,cat:r.cat,image_url:U(r.img),hotspots:r.hotspots||[],sort_order:j})}));if(R.length)await api('POST','rooms',R);n++}
  log('✓ '+c.name)}
 await api('POST','settings?on_conflict=key',{key:'main',value:S.set},{Prefer:'resolution=merge-duplicates'});$('#pg').style.width='100%';log('تم استيراد '+n+' عقار ✓');await load();toast('تم الاستيراد بنجاح')}catch(e){log('خطأ: '+e.message);toast(e.message,1)}}
